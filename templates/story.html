<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>领英学习风格 · 连续 B-Roll（根据音频 / 文字）</title>
<!--
  连续 B-Roll 模板（tutorial-b-roll skill）：根据一段音频或文字稿，一口气做出整段画面。
  只改下面 <script> 里的 STORY：每个场景选一种 type、填内容和时间，不用写动画代码。
  ─────────────────────────────────────────────────────────────
  在这里写清楚（交接用）：
  · 音频：口播.m4a（或 text_timeline.py 生成的配音）；时间轴：口播_timeline.json
  · 图片来源：assets/ 里哪些是 Canva 生成（设计 ID）、哪些是截图 / 软件图标
  ─────────────────────────────────────────────────────────────
  时间：全部是音频里的绝对秒。from/to = 场景起止，场景之间首尾相接（上一个 to = 下一个 from）。
        要点/列表：条目在场景开头自动依次出现（show 可改），at = 口播说到它时高亮/打勾；
        步骤：一开场就以浅色全部出现，at = 说到这一步时点亮；
        数字、对比、胶囊、图片要点：at = 出现时刻。不写 at 就自动依次出现。
        原则：场景开头 0.5 秒内必须有东西，别为了对齐某个字让画面空等。
  顶部标题：是「章节标题」不是字幕。points/steps/stat/compare/apps 不写 title 就沿用上一个，
        同一话题的几个场景共用一个标题、切场景时标题不动；换话题才写新 title（title:'' 隐藏）。
        一般 30–60 秒里只换 2–3 次；具体内容写进卡片/数字标签，不要塞进标题。
  场景类型（字段详见 references/audio-text.md）：
    title      开场标题：图标/logo + 大标题 + 副标题
    points     要点卡片（2–4 个横排，layout:'cards'）或要点列表（最多 6 条，layout:'list'）
    steps      编号步骤，进度线串起来
    stat       大数字（1–3 个），自动从 0 数上去
    compare    左右对比：过去/现在、错误/正确
    statement  一句话金句 + 关键词胶囊
    quote      引用，带荧光笔划重点
    image      图片（Canva 生成 / 截图）+ 文字要点；side:'left'|'right'|'full'
    apps       软件图标：中心 + 环绕（hub）或一排
  预览：浏览器打开本文件（?t=12 看某一刻，&play 播放，&guides 字幕安全区，&scene=S3 只看一个场景）
  渲染：node ~/.claude/skills/tutorial-b-roll/scripts/render.js 本文件 ALL --audio 口播.m4a
-->
<style>
:root{
  --bg:#F3F2EF; --card:#FFFFFF; --ink:#191919; --muted:#666666; --faint:#A8A6A2; --line:#E3E0DB; --gray:#EDEBE7;
  --blue:#0A66C2; --blue-dark:#004182; --blue-mid:#378FE9; --blue-light:#70B5F9; --tint:#EAF3FC; --tint2:#D3E5F8;
  --amber:#E7A33E; --amber-ink:#915907; --amber-tint:#FDF1DC; --green:#057642; --green-tint:#E3F2E9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
body{color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
em{font-style:normal;color:var(--blue)}
.bg{position:absolute;inset:0;background:var(--bg)}
html.alpha .bg,html.alpha .deco{display:none!important}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.blob.b0{left:-180px;top:560px;width:620px;height:620px;background:radial-gradient(circle,#DCEBFA 0%,rgba(220,235,250,0) 70%)}
.blob.b1{right:-160px;top:-140px;width:640px;height:640px;background:radial-gradient(circle,#E4EEF9 0%,rgba(228,238,249,0) 70%)}
.dotgrid{position:absolute;left:60px;top:70px;width:300px;height:220px;background-image:radial-gradient(#C9D9EC 2.4px,transparent 2.6px);background-size:28px 28px;opacity:.9}
.safe{position:absolute;left:0;right:0;top:880px;height:200px;z-index:60;pointer-events:none;display:none;
  background:repeating-linear-gradient(45deg,rgba(231,163,62,.18) 0 14px,rgba(231,163,62,.05) 14px 28px);border-top:2px dashed var(--amber)}
html.guides .safe{display:block}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.a{position:absolute}
.sc{position:absolute;inset:0;display:none}
.sc.on{display:block}
.tnum{font-variant-numeric:tabular-nums}
.o0{opacity:0}

/* 通用：顶部标题、卡片、胶囊、图标块 */
.head{position:absolute;left:0;right:0;top:88px;text-align:center;font-size:58px;font-weight:600;letter-spacing:1px;line-height:84px}
.card{position:absolute;background:var(--card);border-radius:28px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.06)}
html.alpha .card{box-shadow:0 14px 40px rgba(0,0,0,.28)}
.pill{position:absolute;height:56px;padding:0 24px;border-radius:28px;font-size:28px;font-weight:600;display:flex;align-items:center;gap:10px;white-space:nowrap}
.pill svg{width:30px;height:30px;stroke-width:2.6}
.pill.note{height:68px;padding:0 30px;border-radius:34px;font-size:34px;gap:12px}
.pill.note svg{width:36px;height:36px}
.pill.amber{background:var(--amber-tint);color:var(--amber-ink)}
.pill.green{background:var(--green-tint);color:var(--green)}
.pill.blue{background:var(--tint);color:var(--blue-dark)}
.cx{left:0;right:0;margin:auto;width:max-content}
.tile{position:relative;display:grid;place-items:center;border-radius:30%;background:var(--tint);color:var(--blue);flex:none}
.tile svg{width:54%;height:54%}
.tile img{width:100%;height:100%;object-fit:contain;border-radius:22%}
.tile.plain{background:none}
.tile .lit{position:absolute;inset:0;border-radius:inherit;background:var(--blue);color:#fff;display:grid;place-items:center;opacity:0}
.tile.amber{background:var(--amber-tint);color:var(--amber)} .tile.amber .lit{background:var(--amber)}
.tile.gray{background:var(--gray);color:var(--faint)}
.tile.green{background:var(--green-tint);color:var(--green)} .tile.green .lit{background:var(--green)}
.missing{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#E9E6E1 0 16px,#F1EEEA 16px 32px);color:#9A968F;font-size:24px;font-weight:600;text-align:center;padding:20px}

/* title */
.t-wrap{position:absolute;left:0;right:0;top:250px;display:flex;flex-direction:column;align-items:center;text-align:center}
.t-logo{width:172px;height:172px;border-radius:44px;background:linear-gradient(135deg,var(--blue-mid),var(--blue-dark));color:#fff;box-shadow:0 18px 40px rgba(10,102,194,.28)}
.t-logo.img{background:#fff}
.t-title{margin-top:52px;font-size:88px;font-weight:800;letter-spacing:2px;line-height:112px;max-width:1600px}
.t-sub{margin-top:18px;font-size:36px;font-weight:600;color:var(--muted);letter-spacing:3px}
.t-bar{margin-top:34px;height:8px;width:360px;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--blue-mid) 60%,var(--amber));transform-origin:50% 50%}

/* points：cards */
.pc{top:300px;height:380px;padding:46px 40px}
.pc .no{position:absolute;right:40px;top:44px;font-size:72px;font-weight:800;color:var(--tint2)}
.pc b{display:block;margin-top:34px;font-size:46px;font-weight:700;letter-spacing:1px;line-height:58px}
.pc p{margin-top:12px;font-size:28px;color:var(--muted);line-height:40px}
.pc .hi{position:absolute;inset:-3px;border:3px solid var(--blue);border-radius:31px;opacity:0;box-shadow:0 18px 44px rgba(10,102,194,.18)}
/* points：list */
.pl{height:108px;display:flex;align-items:center;gap:26px;padding:0 34px;border-radius:24px}
.pl b{font-size:38px;font-weight:700;white-space:nowrap}
.pl p{font-size:28px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .ck{margin-left:auto;width:52px;height:52px;border-radius:26px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;opacity:0}
.pl .ck svg{width:32px;height:32px;stroke-width:3.2}

/* steps */
.s-node{width:132px;height:132px;border-radius:66px;background:#fff;color:var(--blue-light);font-size:54px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 12px var(--tint),0 8px 20px rgba(0,0,0,.08)}
.s-node svg{width:54px;height:54px}
.s-node .sl{position:absolute;inset:0;border-radius:66px;background:var(--blue);color:#fff;display:grid;place-items:center;opacity:0;box-shadow:0 14px 30px rgba(10,102,194,.3)}
.s-txt{text-align:center}
.s-txt b{display:block;font-size:40px;font-weight:700;line-height:54px}
.s-txt p{margin-top:8px;font-size:27px;color:var(--muted);line-height:38px}

/* stat */
.st-col{text-align:center}
.st-num{font-size:180px;font-weight:800;line-height:200px;color:var(--blue);letter-spacing:-2px;white-space:nowrap}
.st-num small{font-size:72px;font-weight:700;letter-spacing:0;margin-left:6px}
.st-col.amber .st-num{color:var(--amber)} .st-col.green .st-num{color:var(--green)} .st-col.gray .st-num{color:var(--faint)}
.st-col b{display:block;margin-top:8px;font-size:40px;font-weight:700}
.st-col p{margin-top:10px;font-size:28px;color:var(--muted);line-height:40px}
.st-col .ln{width:80px;height:6px;border-radius:3px;background:var(--tint2);margin:22px auto 0}

/* compare */
.cp{top:240px;width:740px;padding:48px 52px 56px;overflow:hidden}
.cp.l{left:150px;background:#FAF9F7;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cp.r{left:1030px}
.cp.r::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--blue)}
.cp .hd{display:flex;align-items:center;gap:22px;font-size:46px;font-weight:700}
.cp.l .hd{color:var(--muted)}
.cp .it{display:flex;align-items:flex-start;gap:20px;margin-top:40px;font-size:40px;font-weight:600;line-height:54px}
.cp.l .it{color:#7A7772}
.cp .mk{width:46px;height:46px;border-radius:23px;display:grid;place-items:center;flex:none;margin-top:4px}
.cp .mk svg{width:24px;height:24px;stroke-width:3}
.cp.l .mk{background:var(--gray);color:var(--faint)}
.cp.r .mk{background:var(--green-tint);color:var(--green)}
.vs{left:902px;width:116px;height:116px;border-radius:58px;background:#fff;color:var(--blue);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.vs svg{width:56px;height:56px;stroke-width:2.6}

/* statement */
.sm-wrap{position:absolute;left:0;right:0;top:300px;text-align:center}
.sm-txt{display:inline-block;max-width:1560px;font-size:96px;font-weight:800;line-height:132px;letter-spacing:2px}
.sm-bar{width:200px;height:10px;border-radius:5px;background:var(--blue);margin:40px auto 0;transform-origin:50% 50%}
.sm-chips{position:absolute;left:0;right:0;top:640px;display:flex;justify-content:center;gap:28px}
.sm-chips .pill{position:relative;height:72px;padding:0 32px;border-radius:36px;font-size:36px;gap:14px}
.sm-chips .pill svg{width:36px;height:36px}

/* quote */
.q-wrap{position:absolute;left:260px;right:260px;top:260px}
.q-mark{position:absolute;left:-40px;top:-150px;font:800 280px/1 Georgia,"Times New Roman",serif;color:var(--tint2)}
.q-txt{position:relative;font-size:68px;font-weight:600;line-height:104px;letter-spacing:1px}
.q-txt em{color:var(--ink);background:linear-gradient(transparent 58%,rgba(231,163,62,.38) 58%) no-repeat 0 0/0% 100%}
.q-by{margin-top:44px;font-size:32px;color:var(--muted);display:flex;align-items:center;gap:18px}
.q-by::before{content:"";width:64px;height:3px;background:var(--blue)}

/* image */
.im{overflow:hidden;border-radius:28px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.06),0 18px 44px rgba(0,0,0,.12)}
.im img,.im .missing{width:100%;height:100%;display:block;object-fit:cover;transform-origin:50% 50%}
.im.contain img{object-fit:contain;background:#fff}
.im-side{display:flex;flex-direction:column;justify-content:center}
.im-side .hd2{font-size:54px;font-weight:700;line-height:74px}
.im-side .it{display:flex;align-items:center;gap:20px;margin-top:30px;font-size:34px;font-weight:600;line-height:46px}
.im-side .it .tile{width:60px;height:60px;border-radius:18px}
.im-full{position:absolute;inset:0;overflow:hidden}
.im-full::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.38) 100%)}
.im-full img,.im-full .missing{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.im-cap{left:120px;top:640px;max-width:1100px;padding:34px 44px;border-radius:28px;background:rgba(255,255,255,.95);box-shadow:0 14px 40px rgba(0,0,0,.28)}
.im-cap b{display:block;font-size:52px;font-weight:700;line-height:68px}
.im-cap p{margin-top:8px;font-size:30px;color:var(--muted)}

/* apps */
.ap{display:flex;flex-direction:column;align-items:center;gap:16px;width:240px}
.ap .tile{width:124px;height:124px;background:#fff;box-shadow:0 10px 26px rgba(0,0,0,.10)}
.ap .tile img{border-radius:0}
.ap span{font-size:30px;font-weight:600;white-space:nowrap}
.hub .tile{width:180px;height:180px;box-shadow:0 0 0 14px var(--tint),0 18px 40px rgba(10,102,194,.25)}
.hub span{font-size:36px;font-weight:700}
</style>
</head>

<div class="deco"><div class="blob b0"></div><div class="blob b1"></div><div class="dotgrid"></div></div>

<script>
// ═══════════════════════ 只改这里：故事板 ═══════════════════════
// 示例：02_03_模型.mp4 前 45 秒口播（transcribe.py 时间轴），节拍注释写「字 时间」。
window.STORY={scenes:[

  {id:'S1',type:'title',from:0,to:2.46,img:'assets/workbuddy.png',title:'WorkBuddy 的<em>模型档位</em>',sub:'第 2 章 · 第 3 节'},

  {id:'S4',type:'statement',from:12.26,to:22.64,text:'过去，只有一个 <em>Auto</em>',
    chips:[{icon:'cpu',text:'系统判断任务难度',at:19.52},{icon:'spark',text:'自动匹配模型',at:21.04}]},
  // 「而这次改版@23.76 … 把 Auto 改成了 低@26.46 中@26.92 高@27.18 这三档，每一档的积分@30.68 消耗倍率是不同的」
  // ↓ S5–S7 同一话题，共用一个顶部标题（S6、S7 不写 title，沿用）
  {id:'S5',type:'compare',from:22.64,to:33.04,title:'这次改版，<em>把选择权交给你</em>',

  // 「我们就有了更多的选择权@35.22」
  {id:'S6',type:'stat',from:33.04,to:36.16,
    items:[{value:0.21,dec:2,suffix:'×',label:'快速',desc:'积分倍率',at:33.2},{value:0.65,dec:2,suffix:'×',label:'均衡',desc:'积分倍率',at:33.6},{value:1.2,dec:2,suffix:'×',label:'极致',desc:'积分倍率',tone:'amber',at:34.0}]},
  // 「比如日常问答@38.36、格式转换@39.02 … 我们就选快速@41.86；均衡@42.74 模式适合写文章」
  {id:'S7',type:'points',layout:'list',check:true,from:36.16,to:45.0,
    items:[{icon:'chat',text:'日常问答',desc:'→ 选「快速」就够',at:38.36},{icon:'file',text:'格式转换',desc:'→ 选「快速」就够',at:39.02},
           {icon:'bal',text:'写文章、做表格',desc:'→ 选「均衡」',at:42.74}]},
]};
// ═══════════════════════ 以下一般不用改 ═══════════════════════

const IC={
  bolt:'<path d="M13 2.5 4.8 13.2h6.4L10.6 21.5l8.6-11h-6.6L13 2.5z"/>',
  bal:'<path d="M12 3v18M5 7h14M5 7l-3 7a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0zM8 21h8"/>',

  x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  dot:'<circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>',
  spark:'<path d="M12 3.5 13.9 10.1 20.5 12 13.9 13.9 12 20.5 10.1 13.9 3.5 12 10.1 10.1z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/>',
  arr:'<path d="M4 12h15M13 6l6 6-6 6"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M9.5 2.5V6M14.5 2.5V6M9.5 18v3.5M14.5 18v3.5M2.5 9.5H6M2.5 14.5H6M18 9.5h3.5M18 14.5h3.5"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  chat:'<path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/>',

  up:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  play:'<path d="M7 4.5v15l12-7.5z"/>',
  lock:'<rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
};
const svg=k=>`<svg class="i" viewBox="0 0 24 24">${IC[k]||IC.dot}</svg>`;

// ---------- 动画工具（全部是 t 的纯函数） ----------
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), L=(a,b,p)=>a+(b-a)*p;
const E={lin:p=>p,out:p=>1-Math.pow(1-p,3),inOut:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  back:p=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)}};
const P=(t,s,d=.5,e=E.out)=>e(C((t-s)/d));
const bump=(t,s,d=.5)=>Math.sin(Math.PI*C((t-s)/d));
function st(el,o){if(!el)return;el.style.transform=`translate(${o.x||0}px,${o.y||0}px) scale(${o.sx??o.s??1},${o.sy??o.s??1})`;if(o.o!==undefined)el.style.opacity=o.o;}
const enter=(el,t,s,d=.5,dy=24)=>{const p=P(t,s,d);st(el,{o:p,y:(1-p)*dy});return p;};
const pop=(el,t,s,d=.45)=>{const p=P(t,s,d,E.back);st(el,{o:P(t,s,d*.6),s:L(.7,1,p)});return p;};
const fromL=(el,t,s,d=.5,dx=-40)=>{const p=P(t,s,d);st(el,{o:p,x:(1-p)*dx});return p;};
function draw(el,p){const l=el.getTotalLength();el.style.strokeDasharray=l;el.style.strokeDashoffset=l*(1-p);el.style.opacity=p>0?1:0;}

// ---------- 构件 ----------
function mk(tag,cls,html='',style=''){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;if(style)e.style.cssText=style;return e;}
const imgTag=src=>`<img src="${src}" onerror="this.outerHTML='<div class=missing>缺图：${src}</div>'">`;
// 图标块：x.img（软件图标/Canva 图）优先，否则 x.icon（内置描边图标）；lit=高亮层
function tile(x,size,lit=false,extra=''){const tone=x.tone?' '+x.tone:'';
  const inner=x.img?imgTag(x.img):svg(x.icon);
  return `<div class="tile${x.img?' plain':''}${tone}${extra}" style="width:${size}px;height:${size}px">${inner}${lit&&!x.img?`<div class="lit">${svg(x.icon)}</div>`:''}</div>`;}
// 未写 at 的元素依次出现
const autoAt=(sc,list,start=.45,gap=.3)=>list.forEach((x,i)=>{if(x.at===undefined)x.at=sc.from+start+i*gap;});
// 顶部标题由全局 #head 统一绘制（见「组装」），这里只告诉布局「有没有标题」
function addHead(sc){return !!sc._head;}
function addNote(sc,el){if(!sc.note)return null;const n=sc.note;
  const p=mk('div',`pill note ${n.tone||'amber'} cx o0`,svg(n.icon||'info')+n.text,`top:${n.top||770}px`);el.append(p);
  if(n.at===undefined)n.at=sc.to-2.2;return p;}

const T={};

T.title=(sc,el)=>{
  const w=mk('div','t-wrap',`<div class="tile t-logo o0${sc.img?' img':''}">${sc.img?imgTag(sc.img):svg(sc.icon||'spark')}</div>
    <div class="t-title o0">${sc.title}</div>${sc.sub?`<div class="t-sub o0">${sc.sub}</div>`:''}<div class="t-bar"></div>`);
  el.append(w);const a=sc.at||{},f=sc.from;
  return t=>{pop($('.t-logo',w),t,a.icon??f+.1,.55);enter($('.t-title',w),t,a.title??f+.3,.55,30);
    enter($('.t-sub',w),t,a.sub??f+.55,.5,16);$('.t-bar',w).style.transform=`scaleX(${P(t,a.bar??f+.75,.7,E.inOut)})`;};
};

T.points=(sc,el)=>{
  const h=addHead(sc,el),it=sc.items,n=it.length,list=sc.layout==='list'||n>4;
  it.forEach((x,i)=>{if(x.show===undefined)x.show=sc.from+.2+i*(list?.18:.16);});
  const nodes=[];
  if(!list){const w=n===2?560:n===3?460:380,gap=n===4?50:60,x0=(1920-(n*w+(n-1)*gap))/2;
    it.forEach((x,i)=>{const c=mk('div','card pc o0',`<div class="hi"></div>${tile(x,104,true)}<span class="no tnum">${String(i+1).padStart(2,'0')}</span><b>${x.text}</b>${x.desc?`<p>${x.desc}</p>`:''}`,`left:${x0+i*(w+gap)}px;width:${w}px`);el.append(c);nodes.push(c);});
  }else{const two=n>4,cw=two?800:1160,rows=two?Math.ceil(n/2):n,rh=108,g=24,y0=two?260:Math.max(240,520-(rows*(rh+g)-g)/2);
    it.forEach((x,i)=>{const col=two?(i<rows?0:1):0,r=two?i%rows:i,left=two?(col?1000:120):380;
      const c=mk('div','card pl o0',`${tile(x,64,true)}<b>${x.text}</b>${x.desc?`<p>${x.desc}</p>`:''}${sc.check?`<div class="ck">${svg('chk')}</div>`:''}`,`left:${left}px;top:${y0+r*(rh+g)}px;width:${cw}px`);el.append(c);nodes.push(c);});}
  const note=addNote(sc,el);
  return t=>{
    it.forEach((x,i)=>{const c=nodes[i];
      if(list)fromL(c,t,x.show,.45,-36);else{const p=P(t,x.show,.6,E.back);st(c,{o:P(t,x.show,.4),y:(1-p)*40});}
      const lit=$('.lit',c);if(lit)lit.style.opacity=x.at!==undefined?P(t,x.at,.3):0;
      const hi=$('.hi',c);if(hi&&x.at!==undefined)hi.style.opacity=bump(t,x.at,.9);
      if(list&&x.at!==undefined)c.style.boxShadow=`0 0 0 ${3*bump(t,x.at,.9)}px #0A66C2,0 1px 3px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.06)`;
      const ck=$('.ck',c);if(ck)x.at!==undefined?pop(ck,t,x.at+.1,.4):ck.style.opacity=0;});
    if(note)pop(note,t,sc.note.at);};
};

T.steps=(sc,el)=>{
  const h=addHead(sc,el),it=sc.items,n=it.length;autoAt(sc,it,.3,.6);
  const gap=Math.min(420,1440/Math.max(1,n-1)),cy=sc.y||450,xs=it.map((_,i)=>960+(i-(n-1)/2)*gap);
  el.append(mk('div','a',`<svg width="1920" height="1080" style="position:absolute;left:0;top:0"><path d="M${xs[0]} ${cy}H${xs[n-1]}" stroke="#E3E0DB" stroke-width="8" stroke-linecap="round"/><path class="fill" d="M${xs[0]} ${cy}H${xs[n-1]}" stroke="#0A66C2" stroke-width="8" stroke-linecap="round" fill="none"/></svg>`,'left:0;top:0'));
  it.forEach((x,i)=>{if(x.show===undefined)x.show=sc.from+.25+i*.15;});
  const nodes=it.map((x,i)=>{const lb=x.icon?svg(x.icon):String(i+1);const c=mk('div','a s-node tnum o0',`${lb}<div class="sl">${lb}</div>`,`left:${xs[i]-66}px;top:${cy-66}px`);
    const tx=mk('div','a s-txt o0',`<b>${x.text}</b>${x.desc?`<p>${x.desc}</p>`:''}`,`left:${xs[i]-(gap-30)/2}px;top:${cy+100}px;width:${gap-30}px`);el.append(c,tx);return [c,tx];});
  const note=addNote(sc,el);const fill=$('.fill',el);
  return t=>{
    let p=0;for(let i=1;i<n;i++)p+=P(t,it[i].at-.45,.45,E.inOut)/(n-1);draw(fill,p);
    // 步骤在场景开头就以浅色出现，说到第几步（at）时点亮
    it.forEach((x,i)=>{const [c,tx]=nodes[i],lit=P(t,x.at,.35);
      const pp=P(t,x.show,.5,E.back);st(c,{o:P(t,x.show,.3),s:L(.7,1,pp)*(1+.08*bump(t,x.at,.5))});$('.sl',c).style.opacity=lit;
      const pe=P(t,x.show+.1,.45);st(tx,{o:pe*L(.45,1,lit),y:(1-pe)*16});});
    if(note)pop(note,t,sc.note.at);};
};

T.stat=(sc,el)=>{
  const h=addHead(sc,el),it=sc.items,n=it.length;autoAt(sc,it,.25,.35);
  const w=n===1?900:n===2?640:520,x0=(1920-n*w)/2,top=h?300:260;
  const nodes=it.map((x,i)=>{const c=mk('div',`a st-col o0 ${x.tone||''}`,`<div class="st-num tnum">${x.prefix||''}<span class="v"></span><small>${x.suffix||''}</small></div><div class="ln"></div><b>${x.label||''}</b>${x.desc?`<p>${x.desc}</p>`:''}`,`left:${x0+i*w}px;top:${top}px;width:${w}px`);el.append(c);return c;});
  const note=addNote(sc,el);
  return t=>{
    it.forEach((x,i)=>{enter(nodes[i],t,x.at,.5,30);const v=$('.v',nodes[i]);
      v.textContent=typeof x.value==='number'?(x.value*P(t,x.at,1.1)).toFixed(x.dec||0):x.value;});
    if(note)pop(note,t,sc.note.at);};
};

T.compare=(sc,el)=>{
  const h=addHead(sc,el),Lf=sc.left,Rt=sc.right;
  if(Lf.at===undefined)Lf.at=sc.from+.2;if(Rt.at===undefined)Rt.at=sc.from+1.0;
  autoAt({from:Lf.at},Lf.items,.3,.3);autoAt({from:Rt.at},Rt.items,.3,.3);
  const side=(s,cls,mark)=>{const c=mk('div',`card cp ${cls} o0`,`<div class="hd">${tile({icon:s.icon||(cls==='l'?'clock':'spark'),img:s.img,tone:cls==='l'?'gray':''},72)}${s.label}</div>`+
    s.items.map(x=>`<div class="it o0"><span class="mk">${svg(mark)}</span><span>${x.text}</span></div>`).join(''));el.append(c);return c;};
  const l=side(Lf,'l',sc.leftMark||'x'),r=side(Rt,'r','chk');
  const ch=Math.max(400,180+Math.max(Lf.items.length,Rt.items.length)*94),top=h?250:Math.round((1000-ch)/2);
  [l,r].forEach(c=>{c.style.top=top+'px';c.style.height=ch+'px';});
  const vs=mk('div','a vs o0',svg('arr'),`top:${top+ch/2-58}px`);el.append(vs);const note=addNote(sc,el);
  return t=>{
    fromL(l,t,Lf.at,.5,-40);fromL(r,t,Rt.at,.5,40);pop(vs,t,Rt.at-.1,.45);
    $$('.it',l).forEach((e,i)=>enter(e,t,Lf.items[i].at,.4,14));$$('.it',r).forEach((e,i)=>enter(e,t,Rt.items[i].at,.4,14));
    if(note)pop(note,t,sc.note.at);};
};

T.statement=(sc,el)=>{
  const w=mk('div','sm-wrap',`<div class="sm-txt o0">${sc.text}</div><div class="sm-bar"></div>`);el.append(w);
  const ch=sc.chips||[];autoAt({from:(sc.at??sc.from+.3)+.6},ch,0,.4);
  const cw=mk('div','sm-chips');ch.forEach(x=>cw.append(mk('div',`pill ${x.tone||'blue'} o0`,(x.icon?svg(x.icon):'')+x.text)));el.append(cw);
  const at=sc.at??sc.from+.3;
  return t=>{const p=P(t,at,.6,E.back);st($('.sm-txt',w),{o:P(t,at,.4),s:L(.92,1,p)});
    $('.sm-bar',w).style.transform=`scaleX(${P(t,at+.35,.6,E.inOut)})`;
    $$('.pill',cw).forEach((e,i)=>pop(e,t,ch[i].at,.45));};
};

T.quote=(sc,el)=>{
  const w=mk('div','q-wrap',`<div class="q-mark o0">“</div><div class="q-txt o0">${sc.text}</div>${sc.by?`<div class="q-by o0">${sc.by}</div>`:''}`);el.append(w);
  const ems=$$('.q-txt em',w),at=sc.at??sc.from+.3,hl=sc.hl||ems.map((_,i)=>at+.9+i*.6);
  return t=>{pop($('.q-mark',w),t,at-.1,.5);enter($('.q-txt',w),t,at,.6,26);if(sc.by)enter($('.q-by',w),t,at+.6,.5,12);
    ems.forEach((e,i)=>e.style.backgroundSize=`${P(t,hl[i]??hl[hl.length-1],.6,E.inOut)*100}% 100%`);};
};

T.image=(sc,el)=>{
  const it=sc.items||[];autoAt({from:sc.from+.45},it,0,.4);const dur=Math.max(.1,sc.to-sc.from);
  if(sc.side==='full'){
    const f=mk('div','im-full o0',imgTag(sc.img));el.append(f);
    const cap=sc.title?mk('div','a im-cap o0',`<b>${sc.title}</b>${sc.sub?`<p>${sc.sub}</p>`:''}`):null;if(cap)el.append(cap);
    return t=>{f.style.opacity=P(t,sc.from,.6);const im=f.firstElementChild;im.style.transform=`scale(${L(1.0,1.08,C((t-sc.from)/dur))})`;
      if(cap)enter(cap,t,sc.at??sc.from+.5,.55,24);};
  }
  const right=sc.side==='right',box=sc.box||[right?880:140,170,900,620];
  const im=mk('div',`a im o0${sc.fit==='contain'?' contain':''}`,imgTag(sc.img),`left:${box[0]}px;top:${box[1]}px;width:${box[2]}px;height:${box[3]}px`);el.append(im);
  const sx=right?140:box[0]+box[2]+90,sw=right?box[0]-90-140:1920-sx-120;
  const sd=mk('div','a im-side',`<div class="hd2 o0">${sc.title||''}</div>`+it.map(x=>`<div class="it o0">${tile(x,60)}<span>${x.text}</span></div>`).join(''),`left:${sx}px;top:${box[1]}px;width:${sw}px;height:${box[3]}px`);el.append(sd);
  return t=>{const p=P(t,sc.from+.05,.6);st(im,{o:p,x:(1-p)*(right?40:-40)});
    const g=im.firstElementChild;if(g)g.style.transform=`scale(${L(1.0,1.06,C((t-sc.from)/dur))})`;
    enter($('.hd2',sd),t,sc.at??sc.from+.3,.5,18);$$('.it',sd).forEach((e,i)=>fromL(e,t,it[i].at,.45,24));};
};

T.apps=(sc,el)=>{
  const h=addHead(sc,el),it=sc.items,n=it.length;autoAt(sc,it,sc.hub?.6:.2,.25);
  const nodes=[],pos=[];let hub=null,lines=null;
  if(sc.hub){const cx=960,cy=sc.cy||540,rx=sc.rx||580,ry=sc.ry||230;
    hub=mk('div','a ap hub o0',tile(sc.hub,180)+`<span>${sc.hub.label||''}</span>`,`left:${cx-120}px;top:${cy-90}px`);
    it.forEach((x,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;pos.push([cx+rx*Math.cos(ang),cy+ry*Math.sin(ang)]);});
    lines=mk('div','a',`<svg width="1920" height="1080" style="position:absolute;left:0;top:0">${pos.map(([x,y])=>`<path d="M${cx} ${cy}L${x} ${y}" stroke="#70B5F9" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" fill="none"/>`).join('')}</svg>`,'left:0;top:0');
    el.append(lines,hub);
  }else{const gap=Math.min(300,1600/n);it.forEach((_,i)=>pos.push([960+(i-(n-1)/2)*gap,sc.cy||480]));}
  it.forEach((x,i)=>{const c=mk('div','a ap o0',tile(x,124)+`<span>${x.label||''}</span>`,`left:${pos[i][0]-120}px;top:${pos[i][1]-62}px`);el.append(c);nodes.push(c);});
  const note=addNote(sc,el);
  return t=>{if(hub)pop(hub,t,sc.hub.at??sc.from+.3,.55);
    if(lines)$$('path',lines).forEach((p,i)=>{p.style.strokeDasharray='2 12';p.style.opacity=P(t,it[i].at-.2,.4);});
    it.forEach((x,i)=>pop(nodes[i],t,x.at,.5));if(note)pop(note,t,sc.note.at);};
};

// ---------- 组装 ----------
const S=window.STORY.scenes.slice().sort((a,b)=>a.from-b.from);
S.forEach((s,i)=>{if(!T[s.type])throw new Error(`场景 ${s.id||i}：未知 type「${s.type}」`);if(!(s.to>s.from))throw new Error(`场景 ${s.id||i}：to 必须大于 from`);
  if(i&&s.from<S[i-1].to-.01)console.warn(`场景 ${s.id} 与上一个重叠`);s.id=s.id||'S'+(i+1);});
// 顶部标题 = 章节标题：points/steps/stat/compare/apps 场景不写 title 就沿用上一个；title:'' 隐藏。
// 相邻场景标题相同就合并成一段，切场景时标题不动，只有换话题才换标题。
const HEADED={points:1,steps:1,stat:1,compare:1,apps:1};
let curHead=null;S.forEach(s=>{if(!HEADED[s.type]){s._head=null;return;}if('title' in s)curHead=s.title||null;s._head=curHead;});
const HEADS=[];S.forEach(s=>{const h=HEADS[HEADS.length-1];if(!s._head)return;
  if(h&&h.text===s._head&&Math.abs(h.to-s.from)<.02)h.to=s.to;else HEADS.push({text:s._head,from:s.from,to:s.to});});
const headEl=$('#head');let headNow=null;
function drawHead(t){const end=S[S.length-1].to,h=HEADS.find(x=>t>=x.from&&(t<x.to||(x.to>=end-.001&&t<=x.to)));
  if(!h){headEl.style.opacity=0;return;}
  if(headNow!==h){headEl.innerHTML=h.text;headNow=h;}
  const pin=P(t,h.from+.1,.5),pout=h.to>=end-.001?0:P(t,h.to-.3,.3,E.inOut);
  st(headEl,{o:pin*(1-pout),y:(1-pin)*18-pout*14});}
function drift(t){const b=$$('.deco .blob');
  if(b[0])b[0].style.transform=`translate(${Math.sin(t*.35)*30}px,${Math.cos(t*.3)*20}px)`;
  if(b[1])b[1].style.transform=`translate(${Math.cos(t*.3)*30}px,${Math.sin(t*.25)*24}px)`;}
const stage=$('#stage');
const live=S.map(s=>{const el=mk('section','sc');el.id=s.id;stage.append(el);return {s,el,up:T[s.type](s,el)};});
const all={kind:'cover',from:S[0].from,to:S[S.length-1].to};
window.BROLL={scenes:{ALL:all},fadeToSource:false};
S.forEach(s=>window.BROLL.scenes[s.id]={kind:'cover',from:s.from,to:s.to});

const Q=new URLSearchParams(location.search),SC=Q.get('scene')||'ALL',META=window.BROLL.scenes[SC]||all;
if(Q.has('guides'))document.documentElement.classList.add('guides');
if(Q.has('alpha'))document.documentElement.classList.add('alpha');
window.renderAt=t=>{
  drift(t);drawHead(t);
  live.forEach(({s,el,up},i)=>{
    const last=i===live.length-1,on=t>=s.from&&(t<s.to||(last&&t<=s.to));
    el.classList.toggle('on',on);if(!on)return;
    up(t);
    // 场景切换：进入 0.35s 上浮淡入（第一个场景由元素自己的入场动画负责），离开 0.3s 上移淡出
    const pin=i?P(t,s.from,.35):1,pout=last?0:P(t,s.to-.3,.3,E.inOut);
    st(el,{o:pin*(1-pout),y:(1-pin)*16-pout*14});
  });
  // 单独渲染某个场景并给了 --src 时：首尾淡到真实画面
  document.body.style.opacity=window.BROLL.fadeToSource?P(t,META.from,.5,E.inOut)*(1-P(t,META.to-.5,.5,E.inOut)):1;
};
const t0=Q.has('t')?+Q.get('t'):META.from+Math.min(2,(META.to-META.from)/2);
window.renderAt(t0);
if(!window.__RENDER__&&Q.has('play')){const s0=performance.now(),a=META.from,len=META.to-META.from+.6;
  const loop=now=>{window.renderAt(a+((now-s0)/1000)%len);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
</script>
</body>
</html>
